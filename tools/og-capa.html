<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;800;900&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;font-family:Nunito,system-ui,sans-serif;font-weight:800;color:#0b0c16;background:#f8f3d5;display:flex;align-items:center;gap:64px;padding:0 90px;box-sizing:border-box}
.bola{position:absolute;border-radius:50%}
.emoji{flex:none;width:300px;height:300px;border-radius:50%;background:#fefcf4;border:8px solid #0b0c16;box-shadow:10px 10px 0 #0b0c16;display:grid;place-items:center;font-size:170px}
h1{display:inline-block;font-family:Bungee,system-ui,sans-serif;font-weight:400;font-size:68px;margin:0 0 26px;line-height:1;padding:18px 30px 14px;background:#f6e200;border:8px solid #0b0c16;border-radius:28px;box-shadow:10px 10px 0 #0b0c16;transform:rotate(-2deg)}
p{font-size:36px;margin:0 0 34px;line-height:1.25}
.chips{display:flex;gap:16px}
.chip{font-family:Bungee,system-ui,sans-serif;font-weight:400;font-size:22px;padding:12px 24px;border-radius:999px;border:5px solid #0b0c16;box-shadow:5px 5px 0 #0b0c16}
.f{background:#00bad1}.m{background:#f6e200}.d{background:#f75c61}
</style></head><body>
<span class="bola" style="width:70px;height:70px;left:40px;top:40px;background:#f6e200"></span>
<span class="bola" style="width:90px;height:90px;right:60px;top:70px;background:#00bad1"></span>
<span class="bola" style="width:80px;height:80px;right:140px;bottom:50px;background:#f75c61"></span>
<span class="bola" style="width:50px;height:50px;left:430px;bottom:40px;background:#763ae7"></span>
<div class="emoji">🎭</div>
<div><h1>SORTEIA MÍMICA</h1><p>Sorteio, cronômetro e placar.<br>É só passar o celular. 📱</p>
<div class="chips"><span class="chip f">Fácil · 1</span><span class="chip m">Médio · 2</span><span class="chip d">Difícil · 4</span></div></div>
</body></html>
